<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172638">
  <meta name="description" content="이영섭의 과학 수업자료">
  <title>이영섭의 과학</title>
  <style>
    :root {
      --ink: #172638;
      --ink-2: #3b4b5e;
      --muted: #687789;
      --line: #dce2e7;
      --page: #f6f7f8;
      --paper: #fff;
      --accent: #e58a47;
      --accent-soft: #fff0e3;
      --blue: #3c6688;
      --radius: 18px;
    }
    * {box-sizing: border-box}
    html {scroll-behavior: smooth}
    body {margin: 0; min-width: 320px; background: var(--page); color: var(--ink); font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased}
    button, a {font: inherit}
    button {cursor: pointer}
    button:disabled {cursor: default; opacity: .35}
    a {color: inherit; text-decoration: none}
    :focus-visible {outline: 3px solid #e5985f; outline-offset: 3px}
    .site-header {height: 64px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.95); display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px,4vw,60px)}
    .brand {font-size: 17px; font-weight: 850; letter-spacing: -.055em; display: inline-flex; align-items: center; gap: 11px}
    .brand-dot {width: 27px; height: 27px; border-radius: 50%; background: var(--accent); box-shadow: inset -6px -5px 0 #d46b35; display: inline-block}
    .header-sub {font-size: 12px; color: #738294; letter-spacing: .06em}
    .page {max-width: 1180px; margin: 0 auto; padding: 65px 24px 100px}
    .home-intro {padding: 40px 0 78px; border-bottom: 1px solid var(--line)}
    .home-intro h1 {font-size: clamp(48px,7vw,76px); font-weight: 850; line-height: 1.2; letter-spacing: -.075em; margin: 0}
    .eyebrow {margin: 0 0 17px; color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .12em}
    .section-line {display: flex; align-items: center; justify-content: space-between; margin: 44px 0 21px}
    .section-line h2 {font-size: 25px; margin: 0; letter-spacing: -.05em}
    .section-line span {font-size: 13px; color: var(--muted)}
    .subject-card {display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; width: min(100%,370px); min-height: 240px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 28px; text-align: left; transition: border-color .2s, box-shadow .2s, transform .2s}
    .subject-card:hover, .chapter-card:hover {border-color: #a7bac8; box-shadow: 0 16px 32px rgba(23,38,56,.08); transform: translateY(-2px)}
    .subject-number {font-family: Georgia,serif; color: var(--accent); font-size: 50px; line-height: 1}
    .subject-name {font-size: 28px; font-weight: 800; letter-spacing: -.055em}
    .subject-bottom {width: 100%; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px}
    .subject-bottom b {font-size: 25px; font-weight: 400; color: var(--ink)}
    .crumb {display: flex; align-items: center; flex-wrap: wrap; gap: 9px; min-height: 29px; font-size: 12px; color: var(--muted)}
    .crumb a:hover {color: var(--ink)}
    .crumb .sep {color: #abb3ba}
    .subject-title {margin: 36px 0 0; font-size: clamp(38px,5vw,55px); letter-spacing: -.065em}
    .chapter-card {width: 100%; display: flex; align-items: center; gap: 22px; padding: 23px 27px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); text-align: left; transition: .2s}
    .chapter-number {display: grid; place-items: center; width: 54px; height: 54px; border-radius: 14px; background: var(--accent-soft); color: #b75c25; font-size: 20px; font-weight: 800}
    .chapter-title {flex: 1; font-weight: 780; font-size: 21px; letter-spacing: -.04em}
    .chapter-arrow {font-size: 24px}
    .deck-page {max-width: 1390px; margin: 0 auto; padding: 14px clamp(12px,3.2vw,52px) 36px}
    .deck-bar {display: flex; align-items: center; justify-content: space-between; gap: 15px; min-height: 35px; margin: 4px 0 10px}
    .deck-title {font-weight: 800; font-size: 14px; letter-spacing: -.035em}
    .deck-count {font-size: 12px; color: var(--muted); white-space: nowrap}
    .stage {height: clamp(425px,calc(100dvh - 235px),720px); overflow: hidden; display: flex; flex-direction: column; padding: clamp(21px,3vh,32px) clamp(24px,4vw,54px) 22px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 16px 36px rgba(28,45,68,.065)}
    .stage-top, .stage-bottom {display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; font-size: 11px; font-weight: 800; color: #80909f; letter-spacing: .12em}
    .stage-top {border-bottom: 1px solid #edf0f2; padding-bottom: 13px}
    .stage-bottom {border-top: 1px solid #edf0f2; padding-top: 12px; margin-top: auto}
    .stage-body {display: flex; flex-direction: column; min-height: 0; flex: 1; justify-content: center; padding: clamp(14px,2vh,25px) 0}
    .topic {font-size: 13px; font-weight: 800; color: #ab612a; margin: 0 0 10px}
    .slide-heading {font-size: clamp(30px,3.2vw,45px); line-height: 1.23; letter-spacing: -.065em; margin: 0; font-weight: 850; word-break: keep-all}
    .lead-line {font-size: clamp(15px,1.4vw,18px); line-height: 1.6; margin: 12px 0 0; color: var(--ink-2)}
    .stage-cover {background: #172638; color: #fff; position: relative}
    .stage-cover .stage-top,.stage-cover .stage-bottom {color: #9baebc; border-color: rgba(255,255,255,.16); position: relative; z-index: 1}
    .stage-cover .stage-body {position: relative; z-index: 1; align-items: flex-start}
    .stage-cover .topic {color: #f3aa6c; margin-bottom: 20px; letter-spacing: .12em}
    .stage-cover h2 {font-size: clamp(42px,5.9vw,83px); max-width: 830px; line-height: 1.17}
    .sun-art {position: absolute; width: min(49vw,560px); aspect-ratio: 1; border-radius: 50%; right: -8%; top: -18%; opacity: .88; background: radial-gradient(circle at 34% 35%,#ffe7a3 0%,#f9b663 14%,#e78336 45%,#bb521e 68%,rgba(187,82,30,0) 69%); filter: drop-shadow(0 0 46px rgba(244,145,54,.25))}
    .sun-orbit {position:absolute; width: min(62vw,730px); aspect-ratio:1; border:1px solid rgba(255,255,255,.10); border-radius:50%; right:-14%; top:-35%}
    .goal-list {display:grid;gap:13px;margin-top:26px}
    .goal {display:flex;align-items:center;gap:22px;padding:20px 24px;background:#f6f8fa;border:1px solid #e4e9ed;border-radius:13px;font-size:clamp(18px,1.9vw,24px);font-weight:650;line-height:1.5;word-break:keep-all}
    .goal em {font-family:Georgia,serif;color:var(--accent);font-style:normal;font-size:27px}
    .fusion-layout {display:grid;grid-template-columns:minmax(0,1.13fr) minmax(0,1fr);gap:clamp(22px,3vw,44px);align-items:center;margin-top:clamp(12px,2vh,24px);min-height:0}
    .image-panel {margin:0;min-width:0;background:#f6f7f7;border:1px solid #e4e8eb;border-radius:12px;padding:clamp(10px,1.5vw,20px)}
    .image-panel img {display:block;width:100%;height:auto;max-height:270px;object-fit:contain}
    .image-panel figcaption {font-size:12px;color:#768595;margin-top:11px;text-align:center}
    .fusion-steps {display:grid;gap:11px}
    .fusion-steps .intro {font-size:clamp(14px,1.22vw,17px);color:var(--ink-2);line-height:1.6;margin:0 0 3px}
    .fact {padding:12px 16px; background:#f7f8f9; border-left:3px solid var(--accent); border-radius:5px}
    .fact strong {display:block;font-size:clamp(17px,1.75vw,23px);line-height:1.3;letter-spacing:-.035em}
    .fact span {display:block;font-size:clamp(13px,1vw,15px);line-height:1.45;color:var(--muted);margin-top:3px}
    .transfer-image {width:100%;height:clamp(120px,21vh,196px);object-fit:contain;object-position:center;margin:13px 0 15px;border-radius:8px;background:#f5f6f7}
    .example-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    .example {background:#f8f9fa;border:1px solid #e6eaee;border-radius:11px;padding:15px 17px;min-width:0}
    .example h3 {font-size:clamp(16px,1.5vw,20px);letter-spacing:-.04em;margin:0 0 7px}
    .example p {font-size:clamp(13px,1.15vw,16px);line-height:1.58;color:var(--ink-2);margin:0;word-break:keep-all}
    .example .num {font-size:12px;color:#b76a34;font-weight:800;margin-right:7px}
    .question-box {background:#f6f8fa;border:1px solid #e5e9ec;border-radius:15px;padding:30px;margin-top:25px}
    .question-box p {font-size:clamp(21px,2.3vw,30px);font-weight:780;line-height:1.4;margin:0 0 21px;letter-spacing:-.045em}
    .answer-toggle {border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:700;padding:10px 18px}
    .answer {font-size:20px;color:#a95723;margin-top:17px;font-weight:800}
    .deck-controls {display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:12px 0}
    .nav-button {display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:116px;min-height:45px;padding:10px 19px;border:1px solid #d5dce2;border-radius:10px;background:#fff;color:var(--ink);font-weight:780;font-size:14px;transition:.15s}
    .nav-button:hover:not(:disabled){border-color:var(--ink)}
    .nav-button.next {background:var(--ink);color:#fff;border-color:var(--ink);justify-self:end}
    .nav-button.prev {justify-self:start}
    .page-dots {display:flex;align-items:center;justify-content:center;gap:8px}
    .dot {width:8px;height:8px;border:0;border-radius:99px;background:#cbd4db;padding:0;transition:.2s}
    .dot.active {width:28px;background:var(--accent)}
    .dot:focus-visible {outline-offset:5px}
    .speaker-notes {background:#fff;border:1px solid var(--line);border-radius:11px;margin:6px 0 0;overflow:hidden}
    .speaker-notes summary {list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;color:#526477;font-size:13px;font-weight:700;padding:14px 18px}
    .speaker-notes summary::-webkit-details-marker {display:none}
    .speaker-notes summary::after {content:'+';margin-left:auto;font-size:18px;font-weight:400}
    .speaker-notes[open] summary::after {content:'−'}
    .speaker-notes p {white-space:pre-line;color:#39495b;font-size:15px;line-height:1.85;padding:0 18px 20px;margin:0;max-width:980px}
    .site-footer {text-align:center;color:#929eaa;font-size:11px;padding:22px 0}
    @media(max-height:730px) and (min-width:801px) {
      .stage {height:auto;min-height:540px;overflow:visible}
      .stage-body {min-height:450px}
      .transfer-image {height:145px}
    }
    @media(max-width:800px) {
      .page {padding:44px 18px 75px}
      .home-intro {padding:42px 0 56px}
      .deck-page {padding:12px 12px 28px}
      .stage {height:auto;min-height:0;padding:19px 19px 15px;overflow:visible}
      .stage-body {padding:24px 0;min-height:290px}
      .stage-cover {min-height:450px;overflow:hidden}
      .stage-cover h2 {font-size:clamp(37px,8vw,57px);max-width:90%}
      .sun-art {width:380px;right:-190px;top:-45px}
      .sun-orbit {width:500px;right:-265px;top:-95px}
      .slide-heading {font-size:clamp(25px,5.5vw,36px)}
      .fusion-layout {grid-template-columns:1fr;gap:15px;margin-top:16px}
      .image-panel img {max-height:250px}
      .fusion-steps {gap:8px}
      .fusion-steps .intro {font-size:15px}
      .fact strong {font-size:19px}.fact span{font-size:14px}
      .transfer-image {height:auto;max-height:220px;margin:17px 0}
      .example-grid {grid-template-columns:1fr}
      .example {padding:14px 17px}
      .example h3 {font-size:18px}.example p {font-size:15px}
      .goal {font-size:18px;padding:18px}
      .deck-controls {position:sticky;bottom:0;z-index:4;background:rgba(246,247,248,.96);backdrop-filter:blur(8px);padding:12px 2px;border-top:1px solid #e7eaee}
      .nav-button {min-width:90px;min-height:44px;padding:9px;font-size:13px}
    }
    @media(max-width:420px) {
      .site-header {height:56px;padding:0 17px}.brand{font-size:16px}.header-sub{display:none}
      .deck-title {font-size:12px}.deck-count{font-size:11px}
      .stage-top,.stage-bottom {font-size:9px;letter-spacing:.06em}
      .stage-body {padding:19px 0}
      .stage-cover {min-height:390px}
      .stage-cover .stage-body {min-height:290px}
      .chapter-card {padding:18px;gap:13px}.chapter-title{font-size:17px}
      .question-box {padding:22px}
    }
    @media(prefers-reduced-motion:reduce) {html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="이영섭의 과학, 메인으로"><span class="brand-dot" aria-hidden="true"></span>이영섭의 과학</a>
    <span class="header-sub">수업자료</span>
  </header>
  <main id="app"></main>
  <script>
    const chapter = '13. 태양에너지의 생성과 전환';
    const fusionNotes = '빅뱅 우주론에서 배웠다시피 태양은 주로 수소와 헬륨으로 이루어져 있죠. 그런데 태양 중심부의 온도가 약 1,500만 K입니다. 이렇게 온도가 높으면 무슨 반응이 일어난다? 바로 수소 핵융합 반응입니다.\n\n수소 원자핵 4개가 융합하면 헬륨 원자핵 1개가 만들어지는데, 이때 질량이 그대로일까요? 질량 결손이 일어나더라~ 줄어든 질량에 해당하는 에너지가 방출되는 겁니다.';
    const transferNotes = '태양에너지는 결국 지구에 도달해서 다양한 에너지로 전환되고, 우리의 삶에 영향을 미치더라~\n\n첫 번째 기상 현상. 비나 눈이 오는 현상을 떠올리면 되겠죠. 여기서 중요한 건 대기와 물의 순환입니다. 물이 증발하는 과정부터 태양에너지가 관여합니다.\n\n두 번째 광합성. 우리가 숨 쉬고 살아갈 수 있는 데도 광합성이 중요하죠. 식물이 태양의 빛에너지를 이용해서 산소와 포도당을 만들고, 우리는 산소로 호흡하고 포도당에서 시작된 영양분도 얻습니다.\n\n세 번째 화석 연료는 광합성에서 이어집니다. 생명체가 땅속에 묻힌 뒤 오랜 세월 열과 압력을 받으면 화석 연료가 되죠. 태양에너지가 화학에너지 형태로 저장된 셈입니다.';
    const slides = [
      {name:'표지',type:'cover'},
      {name:'학습 목표',type:'goals'},
      {name:'수소 핵융합',type:'fusion',notes:fusionNotes},
      {name:'에너지의 전환',type:'transfer',notes:transferNotes},
      {name:'확인 문제',type:'check'}
    ];
    const app = document.getElementById('app');
    function crumbs(inDeck=false){return '<nav class="crumb" aria-label="현재 위치"><a href="#/">홈</a><span class="sep">/</span><a href="#/integrated-science">통합과학</a>'+(inDeck?'<span class="sep">/</span><span>13. 태양에너지의 생성과 전환</span>':'')+'</nav>';}
    function renderHome(){app.className='page';app.innerHTML='<section class="home-intro"><h1>이영섭의 과학</h1></section><div class="section-line"><h2>과목</h2><span>1개 과목</span></div><button class="subject-card" type="button" onclick="location.hash=\'/integrated-science\'"><span class="subject-number">01</span><span class="subject-name">통합과학</span><span class="subject-bottom"><span>수업자료 보기</span><b aria-hidden="true">↗</b></span></button>';}
    function renderSubject(){app.className='page';app.innerHTML=crumbs()+'<h1 class="subject-title">통합과학</h1><div class="section-line"><h2>수업자료</h2><span>1개 차시</span></div><button class="chapter-card" type="button" onclick="location.hash=\'/integrated-science/13/1\'"><span class="chapter-number">13</span><span class="chapter-title">태양에너지의 생성과 전환</span><span class="chapter-arrow" aria-hidden="true">→</span></button>';}
    function renderBody(type){
      if(type==='cover')return '<div class="sun-orbit" aria-hidden="true"></div><div class="sun-art" aria-hidden="true"></div><div class="stage-body"><p class="topic">통합과학 · 13단원</p><h2 class="slide-heading">태양에너지의<br>생성과 전환</h2></div>';
      if(type==='goals')return '<div class="stage-body"><p class="topic">학습 목표</p><h2 class="slide-heading">오늘 알아볼 내용</h2><div class="goal-list"><div class="goal"><em>01</em><span>태양 내부에서 수소 핵융합이 일어나는 과정</span></div><div class="goal"><em>02</em><span>태양에너지가 지구에서 다양한 에너지로 전환되는 사례</span></div></div></div>';
      if(type==='fusion')return '<div class="stage-body"><p class="topic">01 · 태양에너지의 생성</p><h2 class="slide-heading">태양 중심부에서는 무슨 반응이 일어날까?</h2><div class="fusion-layout"><figure class="image-panel"><img src="assets/solar-fusion.png" width="636" height="281" alt="수소 원자핵 4개가 헬륨 원자핵 1개로 융합하며 질량이 4.032 u에서 4.003 u로 감소하는 과정을 나타낸 그림"><figcaption>태양 내부의 수소 핵융합 반응</figcaption></figure><div class="fusion-steps"><p class="intro">태양은 주로 수소와 헬륨으로 이루어져 있죠.</p><div class="fact"><strong>중심부 약 1,500만 K</strong><span>높은 온도에서 수소 핵융합 반응이 일어납니다.</span></div><div class="fact"><strong>수소 원자핵 4개 → 헬륨 원자핵 1개</strong><span>융합 전후에 질량 결손이 나타납니다.</span></div><div class="fact"><strong>질량 결손 → 에너지 방출</strong><span>줄어든 질량에 해당하는 에너지가 방출됩니다.</span></div></div></div></div>';
      if(type==='transfer')return '<div class="stage-body"><p class="topic">02 · 태양에너지의 전환</p><h2 class="slide-heading">태양에너지는 지구에서 어떻게 전환될까?</h2><p class="lead-line">태양에서 시작된 에너지가 지구의 여러 현상으로 이어지더라~</p><img class="transfer-image" src="assets/solar-transformations.png" width="637" height="184" alt="왼쪽부터 비가 내리는 기상 현상, 햇빛을 받는 식물의 광합성, 석탄으로 나타낸 화석 연료"><div class="example-grid"><section class="example"><h3><span class="num">01</span>기상 현상</h3><p>물을 증발시키고 대기를 움직여 비·눈과 물의 순환으로 이어집니다.</p></section><section class="example"><h3><span class="num">02</span>광합성</h3><p>식물은 빛에너지로 산소와 포도당을 만듭니다.</p></section><section class="example"><h3><span class="num">03</span>화석 연료</h3><p>광합성에서 시작된 에너지가 오랜 세월을 거쳐 화학에너지로 저장됩니다.</p></section></div></div>';
      return '<div class="stage-body"><p class="topic">확인 문제</p><h2 class="slide-heading">오늘 내용 정리</h2><div class="question-box"><p>수소 핵융합에서 발생한 질량 결손은 무엇으로 나타날까?</p><button class="answer-toggle" type="button" aria-expanded="false" onclick="toggleAnswer(this)">정답 확인</button><div class="answer" id="answer" hidden>질량 결손에 해당하는 에너지가 방출됩니다.</div></div></div>';
    }
    function toggleAnswer(button){const answer=document.getElementById('answer');answer.hidden=!answer.hidden;button.setAttribute('aria-expanded',String(!answer.hidden));button.textContent=answer.hidden?'정답 확인':'정답 가리기';}
    function renderDeck(index){const s=slides[index];if(!s){location.hash='/integrated-science/13/1';return}const current=index+1;app.className='deck-page';app.innerHTML=crumbs(true)+'<div class="deck-bar"><span class="deck-title">'+chapter+'</span><span class="deck-count">'+String(current).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0')+'</span></div><section class="stage '+(s.type==='cover'?'stage-cover':'')+'" aria-label="'+s.name+' 슬라이드" aria-live="polite"><div class="stage-top"><span>이영섭의 과학</span><span>INTEGRATED SCIENCE</span></div>'+renderBody(s.type)+'<div class="stage-bottom"><span>13 · 태양에너지의 생성과 전환</span><span>'+String(current).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0')+'</span></div></section><nav class="deck-controls" aria-label="슬라이드 이동"><button class="nav-button prev" type="button" onclick="setSlide('+(index-1)+')" '+(index===0?'disabled':'')+'>← 이전</button><div class="page-dots">'+slides.map((v,i)=>'<button type="button" class="dot '+(i===index?'active':'')+'" aria-label="'+(i+1)+'번 슬라이드: '+v.name+'" '+(i===index?'aria-current="step"':'')+' onclick="setSlide('+i+')"></button>').join('')+'</div><button class="nav-button next" type="button" onclick="setSlide('+(index+1)+')" '+(index===slides.length-1?'disabled':'')+'>다음 →</button></nav>'+(s.notes?'<details class="speaker-notes"><summary>강의 설명 보기</summary><p>'+s.notes+'</p></details>':'');}
    function setSlide(i){if(i<0||i>=slides.length)return;location.hash='/integrated-science/13/'+(i+1);}
    function render(){const path=decodeURIComponent(location.hash.slice(1)||'/');const match=path.match(/^\/integrated-science\/13(?:\/(\d+))?\/?$/);if(match){renderDeck(Math.min(slides.length,Math.max(1,Number(match[1])||1))-1);return}if(path==='/integrated-science'){renderSubject();return}renderHome();}
    window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
    window.addEventListener('keydown',e=>{if(!/^#\/integrated-science\/13/.test(location.hash))return;if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','BUTTON','SUMMARY'].includes(document.activeElement.tagName))return;const current=Number(location.hash.split('/').pop())||1;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();setSlide(current);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();setSlide(current-2);}});
    render();
  </script>
